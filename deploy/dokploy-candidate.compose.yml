services:
  web:
    build:
      context: ..
      dockerfile: Dockerfile
    image: webgrade-source-candidate:abf16e7
    restart: unless-stopped
    user: "1001:1001"
    command: ["node", "server.js"]
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      WEBGRADE_GUARD_DIR: /var/lib/webgrade/guard
      WEBGRADE_ANALYSIS_ENABLED: "0"
      DATABASE_URL: ""
      BETTER_AUTH_SECRET: ""
    volumes:
      - candidate_guard:/var/lib/webgrade/guard
    networks:
      - candidate_internal
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  candidate_internal:
    internal: true

volumes:
  candidate_guard:
    name: websitegrader_source_candidate_guard
